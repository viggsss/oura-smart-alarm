<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">ŌURA Smart Alarm architecture</title>
  <desc id="desc">CSV or Oura API data flows through validation, timeline decoding, wake-window analysis and decision output.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08111f"/><stop offset="1" stop-color="#142236"/></linearGradient>
    <linearGradient id="g" x1="0" x2="1"><stop stop-color="#57e389"/><stop offset="1" stop-color="#57c7ff"/></linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0l9 4.5L0 9z" fill="#8ca3bb"/></marker>
  </defs>
  <rect width="1200" height="520" rx="26" fill="url(#bg)"/>
  <text x="600" y="58" text-anchor="middle" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="750">FROM SLEEP DATA TO ONE DECISION</text>
  <text x="600" y="91" text-anchor="middle" fill="#8ea3bb" font-family="ui-monospace,Menlo,monospace" font-size="18">two inputs · one analysis pipeline · explicit fallbacks</text>
  <g font-family="Inter,Arial,sans-serif" text-anchor="middle">
    <g><rect x="55" y="164" width="155" height="74" rx="14" fill="#15263b" stroke="#57e389" stroke-width="3"/><text x="132" y="196" fill="#f8fafc" font-size="21">CSV export</text><text x="132" y="220" fill="#9eb1c7" font-size="15">local data</text></g>
    <g><rect x="55" y="286" width="155" height="74" rx="14" fill="#15263b" stroke="#57e389" stroke-width="3"/><text x="132" y="318" fill="#f8fafc" font-size="21">Oura API</text><text x="132" y="342" fill="#9eb1c7" font-size="15">v2 sleep records</text></g>
    <g><rect x="285" y="211" width="170" height="102" rx="14" fill="#15263b" stroke="#65ddbc" stroke-width="3"/><text x="370" y="251" fill="#f8fafc" font-size="21">Validate</text><text x="370" y="278" fill="#9eb1c7" font-size="15">normalise + reject</text></g>
    <g><rect x="525" y="211" width="175" height="102" rx="14" fill="#15263b" stroke="url(#g)" stroke-width="3"/><text x="612" y="244" fill="#f8fafc" font-size="21">Decode</text><text x="612" y="270" fill="#9eb1c7" font-size="15">30 s stage timeline</text><text x="612" y="292" fill="#9eb1c7" font-size="15">wake-window subset</text></g>
    <g><rect x="770" y="185" width="185" height="154" rx="14" fill="#15263b" stroke="#5bcdf4" stroke-width="3"/><text x="862" y="225" fill="#f8fafc" font-size="21">Decide</text><text x="862" y="254" fill="#9eb1c7" font-size="15">1. confirmed awake</text><text x="862" y="278" fill="#9eb1c7" font-size="15">2. confirmed light</text><text x="862" y="302" fill="#9eb1c7" font-size="15">3. window end</text></g>
    <g><rect x="1020" y="211" width="135" height="102" rx="14" fill="#15263b" stroke="#57c7ff" stroke-width="3"/><text x="1087" y="251" fill="#f8fafc" font-size="21">Explain</text><text x="1087" y="278" fill="#9eb1c7" font-size="15">GUI + plot</text></g>
  </g>
  <g fill="none" stroke="#8ca3bb" stroke-width="4" marker-end="url(#arrow)"><path d="M210 201h45q30 0 30 30"/><path d="M210 323h45q30 0 30-30"/><path d="M455 262h60"/><path d="M700 262h60"/><path d="M955 262h55"/></g>
  <rect x="285" y="404" width="670" height="58" rx="12" fill="#0d1a2a" stroke="#263b53"/>
  <text x="620" y="440" text-anchor="middle" fill="#9eb1c7" font-family="ui-monospace,Menlo,monospace" font-size="18">tested logic stays independent from data loading and the interface</text>
</svg>
